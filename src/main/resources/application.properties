spring.application.name=ipargym

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ipargym?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conserva los datos al reiniciar. La base puede crearse automáticamente si el usuario MySQL tiene permiso.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.mvc.problemdetails.enabled=true
seguridad.jwt.secreto=${JWT_SECRET}
seguridad.jwt.caducidad=${JWT_EXPIRACION:900}
server.error.include-message=never
